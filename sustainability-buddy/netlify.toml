# Netlify Configuration for Sustainability Buddy
# This file configures Netlify build settings and deployment options

[build]
  # Build command - runs Vite build
  command = "npm run build"
  
  # Publish directory - Vite outputs to 'dist' by default
  publish = "dist"
  
  # Environment variables for build (these should be set in Netlify dashboard)
  # VITE_LITELLM_API_KEY - Your LiteLLM API key
  # VITE_LITELLM_GATEWAY_URL - Duke's LiteLLM gateway URL (e.g., https://litellm.oit.duke.edu/v1)
  # VITE_LITELLM_MODEL - Model name (e.g., "GPT 4.1 Mini")

# Redirect rules for SPA routing
# All routes should redirect to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

